<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>好吃鬼大转盘</title>
  <style>
    :root {
      --primary-color: #f75344;
      --primary-hover: #e03b2c;
      --accent-color: #ffd13b;
      --accent-hover: #f5c426;
      --text-main: #2d3748;
      --text-muted: #718096;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5253 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 12px;
      color: var(--text-main);
    }

    .app-container {
      width: 100%;
      max-width: 1000px;
      background: #fdfdfd;
      border-radius: 20px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2);
      padding: 24px 18px;
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 28px;
      align-items: center;
    }

    @media (max-width: 820px) {
      .app-container {
        grid-template-columns: 1fr;
        padding: 20px 14px;
        gap: 24px;
      }
    }

    /* 标题区域 */
    .header-area {
      grid-column: 1 / -1;
      text-align: center;
    }
    .header-area h1 {
      font-size: 24px;
      color: #d63031;
      font-weight: 800;
    }
    .header-area p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* 转盘区域 */
    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .wheel-wrapper {
      position: relative;
      width: min(86vw, 380px);
      height: min(86vw, 380px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Canvas 高清自适应转盘 */
    #wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
      transition: transform cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    /* 中心指针与操作按钮 */
    .wheel-pointer {
      position: absolute;
      width: 22%;
      height: 22%;
      background: var(--accent-color);
      border-radius: 50%;
      border: 4px solid #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      user-select: none;
      z-index: 10;
      transition: transform 0.15s, background-color 0.15s;
    }

    .wheel-pointer:active {
      transform: scale(0.95);
    }

    .wheel-pointer.disabled {
      cursor: not-allowed;
      filter: grayscale(0.5);
      opacity: 0.85;
      transform: scale(1) !important;
    }

    .pointer-arrow {
      position: absolute;
      top: -18px;
      left: 50%;
      margin-left: -10px;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 20px solid var(--accent-color);
      transition: border-bottom-color 0.15s;
    }

    .pointer-text {
      font-size: 14px;
      font-weight: 800;
      color: #831f18;
      text-align: center;
      line-height: 1.15;
    }

    /* 控制面板区域 */
    .control-panel {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
    }

    .badge {
      background: #edf2f7;
      color: #4a5568;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 500;
    }

    .range-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--primary-color);
      cursor: pointer;
    }

    textarea {
      width: 100%;
      height: 74px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      color: var(--text-main);
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 6px;
    }

    button {
      border: none;
      outline: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, background-color 0.2s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary-color);
      color: #fff;
    }
    .btn-accent {
      background: var(--accent-color);
      color: #831f18;
    }
    .btn-secondary {
      background: #edf2f7;
      color: #4a5568;
    }

    .single-input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
    }

    /* 标签列表 */
    .tags-container {
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 2px;
    }

    .tag {
      background: #fff5f5;
      border: 1px solid #fed7d7;
      color: #c53030;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .tag-del {
      font-weight: 700;
      cursor: pointer;
      color: #e53e3e;
      font-size: 13px;
      line-height: 1;
    }

    /* 弹窗 Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      width: 86%;
      max-width: 320px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-emoji {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .modal-result {
      font-size: 24px;
      font-weight: 800;
      color: #d63031;
      margin-bottom: 20px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-area">
      <h1>🎯 好吃鬼大转盘</h1>
      <p>移动端文字防重叠优化版，自动缩放排版</p>
    </div>

    <!-- 转盘显示区 -->
    <div class="wheel-section">
      <div class="wheel-wrapper">
        <canvas id="wheelCanvas"></canvas>
        <div id="wheelPointer" class="wheel-pointer" onclick="startLottery()">
          <div class="pointer-arrow"></div>
          <div id="pointerBtnText" class="pointer-text">开始<br>抽奖</div>
        </div>
      </div>
    </div>

    <!-- 选项配置区 -->
    <div class="control-panel">
      <!-- 旋转时长控制 -->
      <div>
        <div class="panel-item-header">
          <span>旋转耗时 (速度)</span>
          <span id="durationVal" class="badge">4 秒</span>
        </div>
        <div class="range-wrap">
          <input type="range" id="durationInput" min="1" max="8" step="0.5" value="4" oninput="onDurationChange(this.value)">
        </div>
      </div>

      <!-- 批量录入 -->
      <div>
        <div class="panel-item-header">
          <span>快捷批量录入</span>
          <span class="badge">空格或换行隔开 (最多40项)</span>
        </div>
        <textarea id="batchInput" placeholder="在此直接粘贴或输入选项：&#10;张三 李四 王五 赵六 钱七 孙八 周九"></textarea>
        <div class="btn-group">
          <button class="btn-primary" onclick="batchImport('append')">追加添加</button>
          <button class="btn-accent" onclick="batchImport('replace')">覆盖全部</button>
          <button class="btn-secondary" onclick="resetPrizes()">清空重置</button>
        </div>
      </div>

      <!-- 单项添加 -->
      <div>
        <div class="panel-item-header">
          <span>单项添加</span>
          <span id="prizeCountBadge" class="badge">当前 4 项</span>
        </div>
        <div class="single-input-row">
          <input type="text" id="singleInput" placeholder="输入选项名称" onkeydown="if(event.key==='Enter') addSinglePrize()">
          <button class="btn-primary" onclick="addSinglePrize()">添加</button>
        </div>
      </div>

      <!-- 选项标签预览 -->
      <div class="tags-container" id="tagsContainer"></div>
    </div>
  </div>

  <!-- 结果弹窗 -->
  <div id="resultModal" class="modal-overlay" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-emoji">🎉</div>
      <div class="modal-title">好吃鬼抽到了</div>
      <div id="modalPrizeName" class="modal-result">奖项名称</div>
      <button class="btn-primary" style="width: 100%; padding: 10px;" onclick="closeModal()">我知道了</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY_PRIZES = 'WHEEL_WEB_PRIZES_V2';
    const STORAGE_KEY_DURATION = 'WHEEL_WEB_DURATION_V2';
    const MAX_ITEMS = 40;

    let prizes = ['张三', '李四', '王五', '赵六'];
    let duration = 4;
    let currentDeg = 0;
    let isRotating = false;

    window.addEventListener('DOMContentLoaded', () => {
      loadFromStorage();
      renderAll();
      window.addEventListener('resize', renderWheel);
    });

    function loadFromStorage() {
      try {
        const storedPrizes = localStorage.getItem(STORAGE_KEY_PRIZES);
        const storedDuration = localStorage.getItem(STORAGE_KEY_DURATION);
        if (storedPrizes) {
          const parsed = JSON.parse(storedPrizes);
          if (Array.isArray(parsed) && parsed.length >= 2) {
            prizes = parsed.slice(0, MAX_ITEMS);
          }
        }
        if (storedDuration) {
          duration = parseFloat(storedDuration) || 4;
          document.getElementById('durationInput').value = duration;
          document.getElementById('durationVal').innerText = `${duration} 秒`;
        }
      } catch (e) {
        console.error(e);
      }
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_PRIZES, JSON.stringify(prizes));
        localStorage.setItem(STORAGE_KEY_DURATION, duration.toString());
      } catch (e) {
        console.error(e);
      }
    }

    function renderAll() {
      renderWheel();
      renderTags();
      document.getElementById('prizeCountBadge').innerText = `当前 ${prizes.length} 项 (每项 ${(360 / prizes.length).toFixed(1)}°)`;
    }

    // Canvas 绘制核心逻辑：按弧度绝对均匀排布，文本自动测量与缩放
    function renderWheel() {
      const canvas = document.getElementById('wheelCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 2;
      const rect = canvas.getBoundingClientRect();
      const size = rect.width || 340;

      canvas.width = size * dpr;
      canvas.height = size * dpr;
      ctx.scale(dpr, dpr);

      const center = size / 2;
      const outerBorder = 6;
      const radius = center - outerBorder;
      const len = prizes.length;
      const arc = (2 * Math.PI) / len;

      ctx.clearRect(0, 0, size, size);

      // 外红圈
      ctx.beginPath();
      ctx.arc(center, center, center - 2, 0, 2 * Math.PI);
      ctx.fillStyle = '#e03b2c';
      ctx.fill();

      // 配色方案（奇偶互斥）
      const colors = (len % 2 === 0) 
        ? ['#ffffff', '#ffeac4'] 
        : ['#ffffff', '#ffeac4', '#fff5df'];

      // 动态计算文字大小，确保文字绝不超出扇形两翼
      // 扇区中段弧长 = radius * 0.65 * arc
      const availableWidth = radius * 0.68 * arc;
      let fontSize = Math.max(9, Math.min(16, Math.floor(availableWidth * 0.85)));
      if (len > 30) fontSize = 9;

      for (let i = 0; i < len; i++) {
        let colorIdx = i % colors.length;
        if (len % 2 !== 0 && i === len - 1 && colorIdx === 0) {
          colorIdx = 2;
        }

        // 绘制扇形
        // 注意：HTML Canvas 0弧度在正右方，顺时针偏置 -PI/2 使第0项正对正上方
        const startAngle = i * arc - Math.PI / 2;
        const endAngle = startAngle + arc;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, startAngle, endAngle);
        ctx.fillStyle = colors[colorIdx];
        ctx.fill();
        ctx.strokeStyle = '#f8d7da';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 绘制文字：旋转坐标轴到扇区正中间
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(startAngle + arc / 2);

        ctx.fillStyle = '#b33939';
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';

        // 文本最大可用长度（从半径 88% 处到中心按钮边缘）
        const maxTextWidth = radius * 0.55;
        let text = prizes[i];
        
        // 超长文本自动截断加省略号，彻底杜绝重叠
        while (ctx.measureText(text).width > maxTextWidth && text.length > 1) {
          text = text.slice(0, -1);
        }
        if (text !== prizes[i]) {
          text = text.slice(0, -1) + '…';
        }

        ctx.fillText(text, radius * 0.88, 0);
        ctx.restore();
      }
    }

    function renderTags() {
      const container = document.getElementById('tagsContainer');
      container.innerHTML = '';
      prizes.forEach((item, index) => {
        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.innerHTML = `<span>${index + 1}. ${escapeHtml(item)}</span><span class="tag-del" onclick="deletePrize(${index})">&times;</span>`;
        container.appendChild(tag);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function onDurationChange(val) {
      duration = parseFloat(val);
      document.getElementById('durationVal').innerText = `${duration} 秒`;
      saveToStorage();
    }

    function parseBatch(text) {
      const raw = text.trim();
      if (!raw) return [];
      return raw.split(/[\s\u3000]+/).filter(Boolean);
    }

    function batchImport(type) {
      if (isRotating) return;
      const input = document.getElementById('batchInput');
      const items = parseBatch(input.value);

      if (items.length === 0) {
        alert('请输入有效选项');
        return;
      }

      if (type === 'append') {
        let merged = [...prizes, ...items];
        if (merged.length > MAX_ITEMS) {
          alert(`转盘最多支持 ${MAX_ITEMS} 项，超出部分已截取`);
          merged = merged.slice(0, MAX_ITEMS);
        }
        prizes = merged;
      } else {
        if (items.length < 2) {
          alert('覆盖时至少需要输入2个选项');
          return;
        }
        prizes = items.slice(0, MAX_ITEMS);
      }

      input.value = '';
      saveToStorage();
      renderAll();
    }

    function addSinglePrize() {
      if (isRotating) return;
      const input = document.getElementById('singleInput');
      const val = input.value.trim();
      if (!val) return;

      if (prizes.length >= MAX_ITEMS) {
        alert(`最多支持添加 ${MAX_ITEMS} 个选项`);
        return;
      }

      prizes.push(val);
      input.value = '';
      saveToStorage();
      renderAll();
    }

    function deletePrize(idx) {
      if (isRotating) return;
      if (prizes.length <= 2) {
        alert('最少保留 2 个选项');
        return;
      }
      prizes.splice(idx, 1);
      saveToStorage();
      renderAll();
    }

    function resetPrizes() {
      if (isRotating) return;
      if (confirm('确认清空所有选项并恢复默认吗？')) {
        prizes = ['选项A', '选项B'];
        saveToStorage();
        renderAll();
      }
    }

    function startLottery() {
      if (isRotating) return;
      isRotating = true;

      const pointer = document.getElementById('wheelPointer');
      const btnText = document.getElementById('pointerBtnText');
      const canvas = document.getElementById('wheelCanvas');

      pointer.classList.add('disabled');
      btnText.innerText = '抽奖中';

      const total = prizes.length;
      const targetIndex = Math.floor(Math.random() * total);
      const sectorAngle = 360 / total;
      const rounds = 6;

      // 目标扇区中心严丝合缝停在正上方指针处
      const targetDegree = rounds * 360 + (360 - (targetIndex * sectorAngle + sectorAngle / 2));
      const finalDegree = Math.ceil(currentDeg / 360) * 360 + targetDegree;
      currentDeg = finalDegree;

      canvas.style.transitionDuration = `${duration}s`;
      canvas.style.transform = `rotate(${finalDegree}deg)`;

      setTimeout(() => {
        isRotating = false;
        pointer.classList.remove('disabled');
        btnText.innerHTML = '开始<br>抽奖';

        showResultModal(prizes[targetIndex]);
      }, duration * 1000 + 200);
    }

    function showResultModal(name) {
      document.getElementById('modalPrizeName').innerText = name;
      document.getElementById('resultModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('resultModal').classList.remove('active');
    }
  </script>
</body>
</html>
